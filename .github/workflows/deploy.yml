name: Build, Push & Deploy Backend

on:
  push:
    branches:
      - develop
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      BACKEND_IMAGE_NAME: minhtuan2811/fcm-backend
      FAP_IMAGE_NAME: minhtuan2811/fap-api
      BACKEND_CONTEXT: BackendClubManagement
      FAP_CONTEXT: FapAPI
      DOCKERFILE_PATH: Dockerfile

    steps:
      # 1. Checkout code
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Setup Docker Buildx
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # 3. Login Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set short SHA
        id: vars
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      # 4. Build & push Docker image (Backend)
      - name: Build & Push Backend image
        uses: docker/build-push-action@v4
        with:
          context: ${{ env.BACKEND_CONTEXT }}
          file: ${{ env.BACKEND_CONTEXT }}/${{ env.DOCKERFILE_PATH }}
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE_NAME }}:latest
            ${{ env.BACKEND_IMAGE_NAME }}:${{ env.SHORT_SHA }}
          platforms: linux/amd64

      # 5. Build & push Docker image (FapAPI)
      - name: Build & Push FapAPI image
        uses: docker/build-push-action@v4
        with:
          context: ${{ env.FAP_CONTEXT }}
          file: ${{ env.FAP_CONTEXT }}/${{ env.DOCKERFILE_PATH }}
          push: true
          tags: |
            ${{ env.FAP_IMAGE_NAME }}:latest
            ${{ env.FAP_IMAGE_NAME }}:${{ env.SHORT_SHA }}
          platforms: linux/amd64

      # 6. Copy docker-compose.yml to Server
      - name: Copy docker-compose.yml to Server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "${{ env.BACKEND_CONTEXT }}/docker-compose.yml"
          target: "~/"
          overwrite: true

      # 7. Deploy on server via SSH
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            APP_DIR=~/BackendClubManagement
            mkdir -p $APP_DIR
            cd $APP_DIR

            # Tạo .env dùng tag 'latest'
            cat > .env <<EOL
            SPRING_DATASOURCE_URL=${{ secrets.SPRING_DATASOURCE_URL }}
            SPRING_DATASOURCE_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }}
            SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }}
            HOST_FRONT_END=${{ secrets.HOST_FRONT_END }}
            IMAGE_NAME=${{ env.BACKEND_IMAGE_NAME }}:latest
            FAP_IMAGE_NAME=${{ env.FAP_IMAGE_NAME }}:latest
            REDIS_HOST=${{ secrets.REDIS_HOST }}
            REDIS_PORT=${{ secrets.REDIS_PORT }}
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            REDIS_DATABASE=0
            EOL

            echo "🚀 Pulling latest images..."
            docker-compose down || true
            docker-compose pull
            docker-compose up -d

            echo "🧹 Cleaning unused images..."
            docker image prune -af

            echo "✅ Deployment completed successfully with 'latest' images!"
